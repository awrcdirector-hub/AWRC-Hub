<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f8f5" />
    <title>AWRC Hub</title>
    <meta
      name="description"
      content="A clean launch page for AWRC Logbook, Video Library, and Signup."
    />
    <link rel="icon" href="./awrc-hub-icon.png" type="image/png" />
    <link rel="apple-touch-icon" href="./awrc-hub-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="hub" aria-label="AWRC Hub">
      <a
        class="club-mark"
        href="https://docs.google.com/spreadsheets/d/1mmKMRZyJSR3mr8VocTQ2Mimz6OavPIqyVza0tBUV_FU/edit?gid=344134665#gid=344134665"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Open AWRC Hub Google Sheet"
      >
        <img
          src="./awrc-logo.png"
          alt="AWRC"
          decoding="async"
        />
      </a>

      <nav class="app-grid" aria-label="AWRC apps">
        <a class="app-link" href="https://awrc-logbook.onrender.com/">
          <span class="app-icon image-icon" aria-hidden="true">
            <img src="./logbook-icon-v9.png" alt="" decoding="async" />
          </span>
          <span class="app-name">Logbook</span>
        </a>

        <a class="app-link" href="https://awrc-video-library.onrender.com/">
          <span class="app-icon image-icon" aria-hidden="true">
            <img src="./video-library-hub-icon.png" alt="" decoding="async" />
          </span>
          <span class="app-name">Video Library</span>
        </a>

        <a class="app-link" href="#" aria-disabled="true">
          <span class="app-icon signup" aria-hidden="true">
            <span class="clipboard"></span>
            <span class="check"></span>
          </span>
          <span class="app-name">Signup</span>
        </a>
      </nav>
    </main>
  </body>
</html>
