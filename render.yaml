services:
  - type: web
    name: awrc-hub
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    disk:
      name: awrc-hub-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: HUB_STATE_FILE
        value: /var/data/hub-notifications-state.json
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: HUB_NOTIFY_SECRET
        sync: false
