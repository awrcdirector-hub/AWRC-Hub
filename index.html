<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f8f5" />
    <title>AWRC Hub</title>
    <meta
      name="description"
      content="The home base for Aramoho-Whanganui RC day to day operations."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AWRC Hub" />
    <meta property="og:title" content="AWRC Hub" />
    <meta
      property="og:description"
      content="The home base for Aramoho-Whanganui RC day to day operations."
    />
    <meta property="og:url" content="https://awrc-hub.onrender.com/" />
    <meta property="og:image" content="https://awrc-hub.onrender.com/awrc-social-preview.png" />
    <meta property="og:image:secure_url" content="https://awrc-hub.onrender.com/awrc-social-preview.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="AWRC logo" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AWRC Hub" />
    <meta
      name="twitter:description"
      content="The home base for Aramoho-Whanganui RC day to day operations."
    />
    <meta name="twitter:image" content="https://awrc-hub.onrender.com/awrc-social-preview.png" />
    <link rel="icon" href="./awrc-hub-icon.png" type="image/png" />
    <link rel="apple-touch-icon" href="./awrc-hub-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./styles.css" />
    <script src="./hub-notifications.js" defer></script>
  </head>
  <body>
    <main class="hub" aria-label="AWRC Hub">
      <a
        class="club-mark"
        href="https://awrc-hub.onrender.com/#"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Open AWRC Hub"
      >
        <img
          src="./awrc-logo.png"
          alt="AWRC"
          decoding="async"
        />
      </a>

      <section class="notify-panel" aria-labelledby="notifyTitle">
        <div>
          <p class="eyebrow">NOTIFICATIONS</p>
          <h1 id="notifyTitle">One setup for every AWRC app</h1>
          <p class="notify-copy">Choose your name once here, then Hub notifications can come through for Logbook, Video Library, Signup, and future AWRC tools.</p>
        </div>
        <form class="notify-form" id="hubNotifyForm">
          <label for="hubNotifyName">Your name</label>
          <div class="notify-row">
            <input id="hubNotifyName" name="userName" type="text" autocomplete="name" placeholder="Enter name" />
            <button id="hubEnableNotifications" type="submit">Enable notifications</button>
          </div>
          <p class="notify-status" id="hubNotifyStatus" role="status">Notifications are set up from this Hub only once per device.</p>
        </form>
      </section>

      <nav class="app-grid" aria-label="AWRC apps">
        <a class="app-link" href="https://awrc-logbook.onrender.com/">
          <span class="app-icon image-icon" aria-hidden="true">
            <img src="./logbook-icon-v11.png" alt="" decoding="async" />
          </span>
          <span class="app-name">Logbook</span>
        </a>

        <a class="app-link" href="https://awrc-video-library.onrender.com/">
          <span class="app-icon image-icon" aria-hidden="true">
            <img src="./video-library-hub-icon.png" alt="" decoding="async" />
          </span>
          <span class="app-name">Video Library</span>
        </a>

        <a class="app-link" href="https://awrc-training-signup.onrender.com/">
          <span class="app-icon image-icon" aria-hidden="true">
            <img src="./training-signup-icon.png" alt="" decoding="async" />
          </span>
          <span class="app-name">Signup</span>
        </a>
      </nav>
    </main>
  </body>
</html>
