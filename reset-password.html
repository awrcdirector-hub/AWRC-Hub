<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reset AWRC Hub Password</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="shell">
    <section class="hero">
      <p class="eyebrow">AWRC HUB</p>
      <h1>Reset Password</h1>
    </section>
    <section class="admin-panel" open>
      <form class="admin-login" id="resetPasswordForm">
        <label for="newPassword">New password</label>
        <input id="newPassword" type="password" autocomplete="new-password" required />
        <label for="confirmPassword">Confirm password</label>
        <input id="confirmPassword" type="password" autocomplete="new-password" required />
        <button type="submit">Save new password</button>
        <p class="notify-status" id="resetPasswordStatus" role="status"></p>
      </form>
    </section>
  </main>
  <script>
    const form = document.querySelector("#resetPasswordForm");
    const status = document.querySelector("#resetPasswordStatus");
    const token = new URLSearchParams(window.location.search).get("token") || "";

    form?.addEventListener("submit", async (event) => {
      event.preventDefault();
      const nextPassword = document.querySelector("#newPassword")?.value || "";
      const confirmPassword = document.querySelector("#confirmPassword")?.value || "";
      if (!token) {
        status.textContent = "Reset link is missing or invalid.";
        status.dataset.kind = "error";
        return;
      }
      if (nextPassword !== confirmPassword) {
        status.textContent = "Passwords do not match.";
        status.dataset.kind = "error";
        return;
      }
      const response = await fetch("/api/admin/reset-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token, nextPassword }),
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) {
        status.textContent = data.error || "Password could not be reset.";
        status.dataset.kind = "error";
        return;
      }
      status.textContent = "Password reset. You can return to the Hub and sign in.";
      status.dataset.kind = "success";
      form.reset();
    });
  </script>
</body>
</html>
