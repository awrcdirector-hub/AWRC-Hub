<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f8f5" />
    <title>AWRC Hub</title>
    <meta
      name="description"
      content="The home base for Aramoho-Whanganui RC day to day operations."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AWRC Hub" />
    <meta property="og:title" content="AWRC Hub" />
    <meta
      property="og:description"
      content="The home base for Aramoho-Whanganui RC day to day operations."
    />
    <meta property="og:url" content="https://awrc-hub.onrender.com/" />
    <meta property="og:image" content="https://awrc-hub.onrender.com/awrc-social-preview.png" />
    <meta property="og:image:secure_url" content="https://awrc-hub.onrender.com/awrc-social-preview.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="AWRC logo" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AWRC Hub" />
    <meta
      name="twitter:description"
      content="The home base for Aramoho-Whanganui RC day to day operations."
    />
    <meta name="twitter:image" content="https://awrc-hub.onrender.com/awrc-social-preview.png" />
    <link rel="icon" href="./awrc-hub-icon.png" type="image/png" />
    <link rel="apple-touch-icon" href="./awrc-hub-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./styles.css?v=202608271155" />
    <script src="./hub-notifications.js?v=202608271155" defer></script>
  </head>
  <body>
    <main class="hub" aria-label="AWRC Hub">
      <section class="birthday-banner" id="birthdayBanner" aria-label="Member birthdays" hidden></section>

      <a
        class="club-mark"
        href="https://docs.google.com/spreadsheets/d/1mmKMRZyJSR3mr8VocTQ2Mimz6OavPIqyVza0tBUV_FU/edit?gid=344134665#gid=344134665"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Open AWRC operations sheet"
      >
        <img
          src="./awrc-logo.png"
          alt="AWRC"
          decoding="async"
        />
      </a>

      <nav class="app-grid" aria-label="AWRC apps">
        <a class="app-link" href="https://awrc-logbook.onrender.com/">
          <span class="app-icon image-icon" aria-hidden="true">
            <img src="./logbook-icon-v11.png" alt="" decoding="async" />
          </span>
          <span class="app-name">Logbook</span>
        </a>

        <a class="app-link" href="https://awrc-video-library.onrender.com/">
          <span class="app-icon image-icon" aria-hidden="true">
            <img src="./video-library-hub-icon.png" alt="" decoding="async" />
          </span>
          <span class="app-name">Video Library</span>
        </a>

        <a class="app-link" href="https://awrc-training-signup.onrender.com/">
          <span class="app-icon image-icon" aria-hidden="true">
            <img src="./training-signup-icon.png" alt="" decoding="async" />
          </span>
          <span class="app-name">Signup</span>
        </a>
      </nav>

      <section class="utility-panel" aria-label="Hub utilities">
        <details class="notify-panel">
          <summary>Notifications</summary>
          <form class="notify-form" id="hubNotifyForm">
            <label for="hubNotifyName">Your name</label>
            <div class="notify-row">
              <input id="hubNotifyName" name="userName" type="search" list="memberOptions" autocomplete="name" placeholder="Search member" />
              <datalist id="memberOptions"></datalist>
              <button id="hubEnableNotifications" type="submit">Enable</button>
            </div>
            <p class="notify-status" id="hubNotifyStatus" role="status">Choose your name to enable Hub notifications on this device.</p>
          </form>
        </details>

        <details class="admin-panel">
          <summary>Admin</summary>
          <form class="admin-login" id="hubAdminLogin">
            <label for="hubAdminPassword">Password</label>
            <div class="notify-row">
              <input id="hubAdminPassword" type="password" inputmode="numeric" autocomplete="current-password" placeholder="Admin password" />
              <button type="submit">Unlock</button>
            </div>
          </form>
          <div class="admin-tools" id="hubAdminTools" hidden>
            <div class="storage-status" id="hubStorageStatus" role="status">Checking Hub storage...</div>
            <form class="notify-form" id="hubMemberAddForm">
              <label for="hubMemberAddName">Add member</label>
              <div class="notify-row">
                <input id="hubMemberAddName" type="text" autocomplete="off" placeholder="Member name" />
                <button type="submit">Add</button>
              </div>
              <div class="notify-row notify-row-wrap">
                <input id="hubMemberAddGrade" type="text" autocomplete="off" placeholder="Ability grade" />
                <select id="hubMemberAddGender" aria-label="Gender">
                  <option value="">Gender</option>
                  <option value="Female">Female</option>
                  <option value="Male">Male</option>
                  <option value="Other">Other</option>
                </select>
                <input id="hubMemberAddDateOfBirth" type="date" aria-label="Date of birth" />
                <div class="role-checkboxes" id="hubMemberAddRole" aria-label="Member roles">
                  <label><input type="checkbox" value="Athlete" checked /> Athlete</label>
                  <label><input type="checkbox" value="Coach" /> Coach</label>
                  <label><input type="checkbox" value="Admin" /> Admin</label>
                  <label><input type="checkbox" value="Coxswain" /> Coxswain</label>
                </div>
              </div>
            </form>
            <form class="notify-form" id="hubMemberRemoveForm">
              <label for="hubMemberRemoveName">Remove member</label>
              <div class="notify-row">
                <input id="hubMemberRemoveName" type="search" list="memberOptions" autocomplete="off" placeholder="Search member" />
                <button type="submit">Remove</button>
              </div>
            </form>
            <section class="roster-manager" aria-label="Hub roster manager">
              <div class="roster-heading">
                <div>
                  <h2>Roster</h2>
                </div>
                <input id="hubRosterSearch" type="search" autocomplete="off" placeholder="Search roster" />
              </div>
              <div class="roster-table-wrap">
                <table class="roster-table">
                  <thead>
                    <tr>
                      <th>Name</th>
                      <th>Ability grade</th>
                      <th>Gender</th>
                      <th>Date of birth</th>
                      <th>Age group</th>
                      <th>Role</th>
                      <th>Status</th>
                      <th></th>
                    </tr>
                  </thead>
                  <tbody id="hubRosterBody"></tbody>
                </table>
              </div>
            </section>
          </div>
          <p class="notify-status" id="hubAdminStatus" role="status">Manage the Hub member register.</p>
        </details>
      </section>
    </main>
  </body>
</html>
